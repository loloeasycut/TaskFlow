name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"
        env:
          GRADLE_OPTS: "-Xmx2048m"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: app/build/outputs/apk/debug/app-debug.apk
